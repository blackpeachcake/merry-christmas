# Git 훅. `pnpm install` 시 lefthook이 자동으로 설치(sync)한다.
# 급할 때 건너뛰기: LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      # FE 영역만 포맷한다. apps/api·specs·packages/shared(BE 계약 타입)는 BE 담당이라 건드리지 않는다.
      glob:
        - "apps/web/**/*.{js,mjs,cjs,ts,mts,tsx,json,css,md,yml,yaml}"
        - ".github/**/*.{yml,yaml}"
        - "*.{json,md,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: eslint (web)
      root: "apps/web/"
      glob: "*.{js,mjs,ts,mts,tsx}"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# FE 영역(apps/web, packages/shared)만 검사한다. API 테스트는 DB가 필요해 BE 쪽에서 따로 돌린다.
pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck:fe
    - name: unit test
      run: pnpm test:fe
