# 로컬 dev DB. 사용: docker compose up -d  (docker 데몬 켜고)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nacho
      POSTGRES_PASSWORD: nacho
      POSTGRES_DB: nacho_dev
    ports:
      - "5433:5432"
    volumes:
      - merry_pgdata:/var/lib/postgresql/data

volumes:
  merry_pgdata:
